<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>Pipeline Console · AI News Scraper</title>
  <link rel="icon" href="/dashboard/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/dashboard/assets/app.css">
  <script src="/dashboard/assets/js/theme-init.js"></script>
  <script type="module" src="/dashboard/assets/js/app.js"></script>
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
      <symbol id="i-pipeline" viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="6" rx="1.5"/><rect x="15" y="14" width="6" height="6" rx="1.5"/><path d="M9 7h3a3 3 0 0 1 3 3v4"/></symbol>
      <symbol id="i-runs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-review" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/></symbol>
      <symbol id="i-data" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/><path d="M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12a9 9 0 0 1 15.5-6.2"/><path d="M18 3v4h-4"/><path d="M6 21v-4h4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><path d="M12 17.5h.01"/></symbol>
      <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
      <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3"/><path d="M16 7l3 3"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></symbol>
      <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></symbol>
    </defs>
  </svg>

  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app">
    <aside class="sidebar" aria-label="Sidebar">
      <a class="brand" href="#/overview" aria-label="Pipeline Console home">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-bolt"/></svg></span>
        <span class="brand-text"><strong>Pipeline Console</strong><small>AI News Scraper</small></span>
      </a>
      <nav id="nav-side" class="nav" aria-label="Primary"></nav>
      <div class="sidebar-foot">
        <a class="link-quiet" href="/" target="_blank" rel="noopener">Public site <svg class="icon icon-sm" aria-hidden="true"><use href="#i-external"/></svg></a>
        <a class="link-quiet" href="/api/v1/docs/" target="_blank" rel="noopener">API docs <svg class="icon icon-sm" aria-hidden="true"><use href="#i-external"/></svg></a>
      </div>
    </aside>

    <div class="column">
      <header class="topbar">
        <a class="brand brand-compact" href="#/overview" aria-label="Pipeline Console home">
          <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-bolt"/></svg></span>
          <strong>Pipeline Console</strong>
        </a>
        <div class="topbar-spacer"></div>
        <div id="run-indicator" class="topbar-item"></div>
        <div id="conn-indicator" class="topbar-item"></div>
        <button id="btn-key" class="icon-btn" type="button" aria-label="API key settings" title="API key">
          <svg class="icon" aria-hidden="true"><use href="#i-key"/></svg>
        </button>
        <button id="btn-theme" class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme">
          <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>

    <nav id="nav-tabs" class="tabbar" aria-label="Primary"></nav>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <div class="drawer-titles">
        <h2 id="drawer-title"></h2>
        <p id="drawer-sub" class="muted"></p>
      </div>
      <div id="drawer-nav" class="drawer-nav"></div>
      <button id="drawer-close" class="icon-btn" type="button" aria-label="Close panel">
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </dialog>

  <dialog id="confirm" class="modal" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <h2 id="confirm-title"></h2>
    <div id="confirm-body" class="modal-body"></div>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn btn-secondary" type="button">Cancel</button>
      <button id="confirm-ok" class="btn btn-primary" type="button">Confirm</button>
    </div>
  </dialog>

  <dialog id="keydialog" class="modal" aria-labelledby="key-title">
    <form method="dialog" id="key-form">
      <h2 id="key-title">API key</h2>
      <p class="muted" id="key-help">Needed only when the server sets <code>NEWS_API_KEY</code>. Sent as the <code>X-API-Key</code> header to this server only.</p>
      <label class="field" for="key-input"><span class="label">API key</span>
        <input id="key-input" class="input mono" type="password" autocomplete="off" spellcheck="false" aria-describedby="key-help">
      </label>
      <label class="check"><input id="key-remember" type="checkbox"> <span>Remember on this device</span></label>
      <p id="key-error" class="field-error" role="alert" hidden></p>
      <div class="modal-actions">
        <button id="key-clear" class="btn btn-ghost" type="button">Forget key</button>
        <button id="key-cancel" class="btn btn-secondary" type="button">Cancel</button>
        <button id="key-save" class="btn btn-primary" type="submit" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <noscript><p class="noscript">This console needs JavaScript enabled.</p></noscript>
</body>
</html>
