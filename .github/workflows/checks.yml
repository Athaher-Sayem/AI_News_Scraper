name: Project checks

on:
  push:
    branches: [main, Demo-v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check migrations, application, tests, and dependencies
        run: python tools/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install, tests, and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify the committed build is current
        # The app serves the committed frontend/dist; fail if a rebuild differs
        # so stale artifacts can never be served silently.
        shell: bash
        run: |
          if ! git diff --quiet --exit-code -- frontend/dist; then
            echo "frontend/dist is out of date. Run 'npm run build' in frontend/ and commit the result." >&2
            git --no-pager diff --stat -- frontend/dist >&2
            exit 1
          fi
