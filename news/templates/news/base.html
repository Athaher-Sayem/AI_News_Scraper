{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Newsroom · Collected news{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'news/site.css' %}">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="{% url 'news:home' %}">Newsroom<span>Collected news, connected sources</span></a>
    <nav aria-label="Main navigation">
      <a href="{% url 'news:home' %}">Latest</a>
      <a href="{% url 'news_api:docs' %}">API docs</a>
      <a href="{% url 'admin:index' %}">Editor admin</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Source collection · Excerpts remain attributed to their original publishers.</footer>
</body>
</html>
